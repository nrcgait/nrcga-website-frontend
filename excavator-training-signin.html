<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Form - NRCGA</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .compact-header { padding: 6rem 2rem 1.5rem; margin-top: 70px; text-align: center; }
        .nrcga-form { max-width: 560px; margin: 0 auto; padding: 2rem; }
        .nrcga-form .form-group { margin-bottom: 1rem; }
        .nrcga-form label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
        .nrcga-form input, .nrcga-form textarea {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font: inherit;
        }
        .honeypot { position: absolute; left: -9999px; }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <section class="compact-header">
        <div class="container">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Attendance Form</h1>
            <p style="color: var(--text-secondary);">Please complete the form below to record your attendance.</p>
        </div>
    </section>

    <section>
        <form class="nrcga-form" data-nrcga-form="training_signin">
            <div class="honeypot" aria-hidden="true">
                <input type="text" name="website_url" tabindex="-1" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="si-name">Name *</label>
                <input id="si-name" name="name" required>
            </div>
            <div class="form-group">
                <label for="si-email">Email *</label>
                <input id="si-email" name="email" type="email" required>
            </div>
            <div class="form-group">
                <label for="si-phone">Phone</label>
                <input id="si-phone" name="phone">
            </div>
            <div class="form-group">
                <label for="si-company">Company</label>
                <input id="si-company" name="company">
            </div>
            <div class="form-group">
                <label for="si-date">Training date</label>
                <input id="si-date" name="training_date" type="date">
            </div>
            <div class="form-group">
                <label for="si-notes">Notes</label>
                <textarea id="si-notes" name="notes" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit attendance</button>
            <p data-form-status></p>
        </form>
    </section>

    <div id="footer-placeholder"></div>

    <script src="js/nav-config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/components.js"></script>
    <script src="js/native-forms.js"></script>
</body>
</html>
